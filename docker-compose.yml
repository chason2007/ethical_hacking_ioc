version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: netprotocol-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/network_analysis.db
      - MAX_UPLOAD_SIZE_MB=50
      - DEBUG=False
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./sample-data:/app/sample-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: netprotocol-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
